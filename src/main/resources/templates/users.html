<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User List</title>
    <style>
        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<h2>All Registered Users</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Department</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.mobile}"></td>
        <td th:text="${u.deptartment}"></td>

        <!-- DELETE BUTTON -->
        <td>
            <a th:href="@{'/users/delete/' + ${u.id}}"
               style="color: red; font-weight: bold; text-decoration: none;">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
